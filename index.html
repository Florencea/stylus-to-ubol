<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uBOL Workbench</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="card hub-card">
        <header class="hub-header">
          <div class="logo-box">uBOL</div>
          <div>
            <h1>uBOL Workbench</h1>
            <p class="subtitle">
              uBlock Origin Lite Single Source of Truth (SSOT) Style Workbench
            </p>
          </div>
        </header>

        <section class="action-section">
          <!-- (1) File Import -->
          <div
            class="dropzone"
            id="ubol-dropzone"
            tabindex="0"
            role="button"
            aria-label="Import uBOL Configuration"
          >
            <input
              type="file"
              id="ubol-file-input"
              accept=".json,application/json"
              multiple
              style="display: none"
            />
            <button
              type="button"
              class="btn btn-secondary"
              id="btn-import-ubol"
            >
              Import uBOL Configuration
            </button>
            <span class="drop-hint">or drop .json backup file(s) here</span>
          </div>

          <!-- Multi-Config Hub Container (Side-by-Side Management) -->
          <div class="configs-container" id="configs-container" hidden>
            <div class="configs-header">
              <span class="configs-title">Loaded Configurations</span>
              <button type="button" class="btn-clear" id="btn-clear-configs">
                Clear All
              </button>
            </div>
            <div class="configs-list" id="configs-list"></div>
          </div>

          <!-- (2) Script Install Button -->
          <a
            class="btn btn-install disabled"
            id="btn-install-userscript"
            download="ubol-workbench.user.js"
            role="button"
            aria-disabled="true"
          >
            Install Userscript
          </a>

          <!-- Status Info -->
          <div class="status-info" id="status-info" hidden></div>

          <!-- (3) Error Alert Area -->
          <div class="error-panel" id="error-panel" hidden>
            <div class="error-header">
              <span class="error-title">Invalid Configuration</span>
            </div>
            <pre class="error-message" id="error-message"></pre>
            <button class="btn btn-secondary" id="btn-copy-debug" type="button">
              Copy Debug Info for Agent
            </button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
