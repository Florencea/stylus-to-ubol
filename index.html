<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stylus-to-ubol</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <main class="card converter-card">
        <header class="converter-header">
          <div class="logo-box">S2U</div>
          <div>
            <h1>stylus-to-ubol</h1>
            <p class="subtitle">
              Pure client-side Stylus to uBlock Origin Lite compiler
            </p>
          </div>
        </header>

        <section class="action-section">
          <!-- Dropzone for stylus.json upload -->
          <div
            class="dropzone"
            id="stylus-dropzone"
            tabindex="0"
            role="button"
            aria-label="Upload Stylus JSON export file"
          >
            <input
              type="file"
              id="stylus-file-input"
              accept=".json,application/json"
              style="display: none"
            />
            <button
              type="button"
              class="btn btn-secondary"
              id="btn-upload-stylus"
            >
              Select stylus.json
            </button>
            <span class="drop-hint">or drop stylus.json export file here</span>
          </div>

          <!-- File Info Status Bar -->
          <div class="file-status" id="file-status" hidden>
            <span class="file-name" id="file-name"></span>
            <span class="file-badge">Ready</span>
          </div>

          <!-- Statistics Panel -->
          <div class="stats-panel" id="stats-panel" hidden>
            <div class="stats-card">
              <div class="stats-card-header">
                <span class="stats-card-title">Configuration Summary</span>
              </div>
              <div class="stats-metrics">
                <div class="metric">
                  <span class="metric-label">Target Domains</span>
                  <span class="metric-value" id="stats-domains">0</span>
                </div>
                <div class="metric">
                  <span class="metric-label">Hide Rules</span>
                  <span class="metric-value" id="stats-hides">0</span>
                </div>
                <div class="metric">
                  <span class="metric-label">Style Rules</span>
                  <span class="metric-value" id="stats-styles">0</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Download Action Button -->
          <div class="download-section" id="download-section">
            <button
              type="button"
              class="btn btn-download disabled"
              id="btn-download"
              disabled
            >
              Download my-ubol-settings.json
            </button>
          </div>

          <!-- Error Alert Panel -->
          <div class="error-panel" id="error-panel" hidden>
            <div class="error-header">
              <span class="error-title">Invalid Stylus JSON</span>
            </div>
            <pre class="error-message" id="error-message"></pre>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
